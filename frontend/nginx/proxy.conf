proxy_pass http://karname_backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# nginx is the edge: the client address replaces anything the client claimed
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $karname_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
# nginx sets these for every response; the backend's own copies would be duplicates
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
