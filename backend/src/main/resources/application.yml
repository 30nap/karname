spring:
  application:
    name: karname
  autoconfigure:
    exclude:
      # Authentication is handled by AuthController; no in-memory default user.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${KARNAME_DB_URL:jdbc:postgresql://localhost:5432/karname}
    username: ${KARNAME_DB_USER:karname}
    password: ${KARNAME_DB_PASSWORD:karname}
    hikari:
      maximum-pool-size: ${KARNAME_DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: ${KARNAME_SESSION_TIMEOUT:12h}
    jdbc:
      initialize-schema: never
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # backups of years of data; statement imports are capped at 5 MB in code
      max-file-size: 50MB
      max-request-size: 52MB
  jackson:
    deserialization:
      # Jackson 3 rejects absent primitives by default; absent booleans in requests mean "false".
      fail-on-null-for-primitives: false

server:
  port: ${KARNAME_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# The OpenAPI description and Swagger UI are off unless KARNAME_API_DOCS=true (e.g. in development).
springdoc:
  api-docs:
    enabled: ${KARNAME_API_DOCS:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${KARNAME_API_DOCS:false}
    path: /swagger-ui.html

karname:
  timezone: ${KARNAME_TIMEZONE:Asia/Tehran}
  scheduling:
    # Background jobs: recurring postings, notifications and automatic prices.
    enabled: ${KARNAME_SCHEDULING_ENABLED:true}
  ai:
    # Optional: with an Anthropic API key in the environment, a ready provider is set up on first
    # start (the key is read from the environment each time, never stored in the database).
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    # AI requests per user per day, until an administrator sets a limit in the settings.
    default-daily-limit: ${KARNAME_AI_DAILY_LIMIT:100}
    # An offline scripted model for demos and end-to-end tests; never enable in production.
    fake-enabled: ${KARNAME_AI_FAKE:false}
  demo:
    # Creates the user "demo" with six months of sample data on first start (for trying the app).
    enabled: ${KARNAME_DEMO:false}
    # Empty: a random password is generated and written to the log.
    password: ${KARNAME_DEMO_PASSWORD:}
  security:
    # Base64-encoded 32-byte key for AES-GCM encryption of stored API keys.
    # Required in production; generate with: openssl rand -base64 32
    secret-key: ${KARNAME_SECRET_KEY:}
    remember-me-duration: ${KARNAME_REMEMBER_ME_DURATION:30d}
    login-max-attempts: ${KARNAME_LOGIN_MAX_ATTEMPTS:5}
    login-lockout: ${KARNAME_LOGIN_LOCKOUT:15m}
    # New accounts per client address per hour.
    registrations-per-hour: ${KARNAME_REGISTRATIONS_PER_HOUR:10}
    cookie-secure: ${KARNAME_COOKIE_SECURE:false}
    secret-key-file: ${KARNAME_SECRET_KEY_FILE:./data/secret.key}
