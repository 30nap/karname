error.generic=خطایی رخ داد.
error.internal=خطای داخلی سرور رخ داد. لطفاً دوباره تلاش کنید.
error.badRequest=درخواست نامعتبر است.
error.validation=بعضی از مقادیر واردشده معتبر نیستند.
error.notFound=موردی پیدا نشد.
error.unauthorized=لطفاً وارد حساب کاربری شوید.
error.forbidden=اجازه‌ی دسترسی به این بخش را ندارید.
error.concurrentModification=این مورد هم‌زمان در جای دیگری تغییر کرده است. صفحه را تازه کنید و دوباره تلاش کنید.
error.integrity=این عملیات با داده‌های موجود سازگار نیست.

auth.registrationClosed=ثبت‌نام کاربر جدید توسط مدیر بسته شده است.
auth.invalidUsername=نام کاربری باید ۳ تا ۳۲ کاراکتر و فقط شامل حروف کوچک انگلیسی، عدد، نقطه، خط تیره یا زیرخط باشد.
auth.weakPassword=رمز عبور باید حداقل ۸ کاراکتر باشد و با نام کاربری یکی نباشد.
auth.usernameTaken=این نام کاربری قبلاً گرفته شده است.
auth.invalidCredentials=نام کاربری یا رمز عبور اشتباه است.
auth.disabled=حساب کاربری شما غیرفعال شده است.
auth.totpRequired=کد ورود دومرحله‌ای را وارد کنید.
auth.invalidTotp=کد ورود دومرحله‌ای نادرست است.
auth.tooManyAttempts=تلاش‌های ناموفق زیادی انجام شد. چند دقیقه‌ی دیگر دوباره امتحان کنید.
auth.tooManyRegistrations=تعداد ثبت‌نام‌ها از این دستگاه زیاد است. بعداً تلاش کنید.
auth.wrongPassword=رمز عبور اشتباه است.
auth.invalidDisplayName=نام نمایشی معتبر نیست.
auth.lastAdmin=حداقل یک مدیر فعال باید باقی بماند.
auth.cannotDisableSelf=نمی‌توانید حساب خودتان را غیرفعال کنید.
auth.cannotDeleteSelf=برای حذف حساب خودتان از بخش تنظیمات استفاده کنید.
user.notFound=کاربر پیدا نشد.

totp.alreadyEnabled=ورود دومرحله‌ای از قبل فعال است.
totp.notSetUp=ابتدا راه‌اندازی ورود دومرحله‌ای را شروع کنید.
totp.invalidCode=کد واردشده نادرست است.
